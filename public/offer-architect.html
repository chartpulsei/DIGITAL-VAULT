<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offer Architect — $3K Offer System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px;
      overflow: hidden;
    }
    .chat-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--border-primary);
      flex-shrink: 0;
    }
    .chat-toolbar-left { display: flex; flex-direction: column; gap: 4px; }
    .chat-toolbar-left h1 { font-size: 1.1rem; font-weight: 700; }
    .chat-toolbar-left p { font-size: 0.8rem; color: var(--text-secondary); }
    .stage-tracker {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-accent);
      transition: all 0.3s;
    }
    .stage-dot.done { background: var(--accent-green); }
    .stage-dot.active { background: var(--accent-gold); box-shadow: 0 0 6px rgba(212,168,67,0.5); }
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .msg {
      display: flex;
      gap: 12px;
      max-width: 82%;
      animation: fadeIn 0.3s ease;
    }
    .msg-ai { align-self: flex-start; }
    .msg-user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-ai .msg-avatar { background: rgba(212, 168, 67, 0.15); }
    .msg-user .msg-avatar { background: rgba(124, 92, 191, 0.15); }
    .msg-content { display: flex; flex-direction: column; gap: 4px; }
    .msg-name { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
    .msg-user .msg-name { text-align: right; }
    .msg-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-ai .msg-bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }
    .msg-user .msg-bubble {
      background: var(--accent-purple);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .typing-msg { align-self: flex-start; display: flex; gap: 12px; }
    .typing-bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
    }
    .input-area {
      padding: 16px 0 20px;
      border-top: 1px solid var(--border-primary);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 12px 16px;
      outline: none;
      resize: none;
      min-height: 52px;
      max-height: 160px;
      transition: border-color var(--transition);
      line-height: 1.5;
    }
    .input-area textarea:focus { border-color: var(--accent-gold-dark); }
    .input-area textarea:disabled { opacity: 0.5; }
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-secondary);
      text-align: center;
      padding: 40px;
    }
    #empty-state .spinner-lg { margin-bottom: 8px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <div class="nav-brand-icon">$</div>
      $3K Offer System
    </a>
    <ul class="nav-links">
      <li><a href="/offer-architect.html" class="active">Offer Architect</a></li>
      <li><a href="/sales-analyzer.html">Objection Analyzer</a></li>
      <li><a href="/reels-generator.html">Reels Generator</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="chat-layout">
    <div class="chat-toolbar">
      <div class="chat-toolbar-left">
        <h1>🏗️ High-Ticket Offer Architect</h1>
        <p>6-stage AI interview to uncover your $3K–$10K digital offer</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="stage-tracker" id="stageTracker">
          <div class="stage-dot active" title="Stage 1: Background"></div>
          <div class="stage-dot" title="Stage 2: Skills"></div>
          <div class="stage-dot" title="Stage 3: Market"></div>
          <div class="stage-dot" title="Stage 4: Offer"></div>
          <div class="stage-dot" title="Stage 5: Validation"></div>
          <div class="stage-dot" title="Stage 6: Messaging"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="resetChat()">↺ Reset</button>
      </div>
    </div>

    <div class="messages-wrap" id="messages">
      <div id="empty-state">
        <div class="spinner spinner-lg"></div>
        <p>Starting your offer interview...</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="userInput" placeholder="Type your answer here... (Enter to send, Shift+Enter for new line)" rows="1" disabled></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>
</main>

<script>
  let messageHistory = [];
  let isStreaming = false;
  let currentStage = 1;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('empty-state');

  const STAGE_KEYWORDS = ['stage 2', 'stage 3', 'stage 4', 'stage 5', 'stage 6', 'skill extraction', 'market alignment', 'offer architecture', 'high-ticket validation', 'positioning'];

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  inputEl.addEventListener('input', () => autoGrow(inputEl));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function updateStageDots(text) {
    const lower = text.toLowerCase();
    if (lower.includes('stage 2') || lower.includes('skill extraction')) currentStage = Math.max(currentStage, 2);
    if (lower.includes('stage 3') || lower.includes('market alignment')) currentStage = Math.max(currentStage, 3);
    if (lower.includes('stage 4') || lower.includes('offer architect')) currentStage = Math.max(currentStage, 4);
    if (lower.includes('stage 5') || lower.includes('high-ticket valid')) currentStage = Math.max(currentStage, 5);
    if (lower.includes('stage 6') || lower.includes('positioning')) currentStage = Math.max(currentStage, 6);
    const dots = document.querySelectorAll('.stage-dot');
    dots.forEach((dot, i) => {
      dot.classList.remove('active', 'done');
      if (i + 1 < currentStage) dot.classList.add('done');
      else if (i + 1 === currentStage) dot.classList.add('active');
    });
  }

  function appendMsg(role, text) {
    const isAI = role === 'assistant';
    const el = document.createElement('div');
    el.className = 'msg ' + (isAI ? 'msg-ai' : 'msg-user');
    el.innerHTML = `
      <div class="msg-avatar">${isAI ? '🤖' : '👤'}</div>
      <div class="msg-content">
        <span class="msg-name">${isAI ? 'Offer Architect AI' : 'You'}</span>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      </div>
    `;
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing-msg';
    el.id = 'typing';
    el.innerHTML = `
      <div class="msg-avatar" style="background:rgba(212,168,67,0.15);">🤖</div>
      <div class="typing-bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    `;
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setInputEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) inputEl.focus();
  }

  async function startInterview() {
    try {
      const response = await fetch('/api/offer-architect/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [] }),
      });

      if (emptyState) emptyState.remove();

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        appendMsg('assistant', '⚠️ ' + (err.error || 'Failed to start the interview. Please check your API key.'));
        return;
      }

      await streamResponse(response);
    } catch (e) {
      if (emptyState) emptyState.remove();
      appendMsg('assistant', '⚠️ Could not connect to the server. Make sure it is running.');
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    setInputEnabled(false);
    isStreaming = true;

    messageHistory.push({ role: 'user', content: text });
    appendMsg('user', text);
    showTyping();

    try {
      const response = await fetch('/api/offer-architect/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messageHistory }),
      });

      hideTyping();

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        appendMsg('assistant', '⚠️ ' + (err.error || 'Something went wrong. Please try again.'));
        isStreaming = false;
        setInputEnabled(true);
        return;
      }

      await streamResponse(response);
    } catch (e) {
      hideTyping();
      appendMsg('assistant', '⚠️ Connection error. Please try again.');
      isStreaming = false;
      setInputEnabled(true);
    }
  }

  async function streamResponse(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let aiText = '';

    // Create AI message bubble for streaming
    const msgEl = document.createElement('div');
    msgEl.className = 'msg msg-ai animate-in';
    msgEl.innerHTML = `
      <div class="msg-avatar" style="background:rgba(212,168,67,0.15);">🤖</div>
      <div class="msg-content">
        <span class="msg-name">Offer Architect AI</span>
        <div class="msg-bubble" id="streaming-bubble"></div>
      </div>
    `;
    messagesEl.appendChild(msgEl);
    const bubble = document.getElementById('streaming-bubble');

    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          if (parsed.error) {
            bubble.textContent = '⚠️ ' + parsed.error;
            break;
          }
          if (parsed.text) {
            aiText += parsed.text;
            bubble.textContent = aiText;
            scrollToBottom();
          }
        } catch {}
      }
    }

    bubble.id = '';
    if (aiText) {
      messageHistory.push({ role: 'assistant', content: aiText });
      updateStageDots(aiText);
    }

    isStreaming = false;
    setInputEnabled(true);
  }

  function resetChat() {
    if (isStreaming) return;
    messageHistory = [];
    currentStage = 1;
    messagesEl.innerHTML = '<div id="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--text-secondary);text-align:center;padding:40px;"><div class="spinner spinner-lg"></div><p>Restarting interview...</p></div>';
    setInputEnabled(false);
    document.querySelectorAll('.stage-dot').forEach((d, i) => {
      d.classList.remove('active', 'done');
      if (i === 0) d.classList.add('active');
    });
    startInterview();
  }

  // Kick off on load
  startInterview();
</script>
</body>
</html>
